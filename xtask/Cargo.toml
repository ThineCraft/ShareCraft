[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
brotli = "9.1.1"
dotenvy = "0.15.7"
flate2 = "1.1.11"
serde_json = "1.0.154"
sha2 = "0.11.1"
rcgen = { version = "0.14.5", default-features = false, features = ["crypto", "ring"] }
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
toml = "1.2.1"
