<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Groups</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <a href="/">Sites</a>
  <a id="site-link" href="#" hidden></a>
  <span id="who" class="meta"></span>
  <span class="spacer"></span>
  <a id="people-link" class="button plain" href="/people.html" hidden>People</a>
  <button type="button" id="sign-out" class="plain">Sign out</button>
 </nav>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1 id="title">Groups</h1>
 <p id="error" role="alert" class="msg"></p>
 <form id="new-group" class="row" hidden>
  <div class="field">
   <label for="group-name">New organisation group</label>
   <input type="text" id="group-name" maxlength="60" autocomplete="off" required>
  </div>
  <button type="submit">New group</button>
 </form>
 <div id="groups"></div>
 <p id="empty" hidden>There are no groups you can see.</p>
</div>
<script type="module" src="./groups.js"></script>
</body>
</html>
