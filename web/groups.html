<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Groups</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<div class="page admin-page">
 <nav class="topbar" aria-label="Account">
  <a class="wordmark" href="/" aria-label="ShareCraft, all sites"><span class="wordmark-word">ShareCraft</span></a>
  <span class="spacer"></span>
 </nav>
 <div class="admin-layout">
  <nav id="admin-nav" class="admin-nav" aria-label="Admin centre"></nav>
  <main class="admin-main">
 <p id="site-back" class="site-back" hidden><a id="site-link" href="#"></a></p>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1 id="title">Groups</h1>
 <p id="error" role="alert" class="msg"></p>
 <form id="new-group" class="row" hidden>
  <div class="field">
   <label for="group-name">New organisation group</label>
   <input type="text" id="group-name" maxlength="60" autocomplete="off" required>
  </div>
  <button type="submit">New group</button>
 </form>
 <div id="groups"></div>
 <p id="empty" hidden>There are no groups you can see.</p>
  </main>
 </div>
</div>
<script type="module" src="./groups.js"></script>
</body>
</html>
