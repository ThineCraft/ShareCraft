<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Quarantine</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <a class="wordmark" href="/" aria-label="ShareCraft, all sites"><span class="wordmark-word">ShareCraft</span></a>
  <span class="spacer"></span>
 </nav>
 <nav class="subnav" aria-label="Administration">
  <a href="/people.html">People</a>
  <a href="/admin-sites.html">Manage sites</a>
  <a href="/sharing.html">Organisation settings</a>
 </nav>
 <h1>Quarantine</h1>
 <p class="meta">Content the malware scanner found a threat in, or could not check. Nobody can open or download it until an administrator releases it. Deleting it removes every file that holds it.</p>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <p id="error" role="alert" class="msg"></p>
 <ul id="entries" class="list" aria-label="Quarantined content"></ul>
 <p id="empty" class="meta" hidden>Nothing is quarantined.</p>
</div>

<dialog id="release-dialog" aria-labelledby="release-title">
 <form id="release-form" method="dialog">
  <h2 id="release-title">Release</h2>
  <p id="release-text"></p>
  <div class="field">
   <label for="release-reason">Why it is safe to release (at least 3 characters)</label>
   <textarea id="release-reason" class="short" maxlength="500" required></textarea>
  </div>
  <p id="release-error" role="alert" class="msg"></p>
  <div class="row end">
   <button type="button" id="release-cancel" class="plain">Cancel</button>
   <button type="button" id="release-confirm">Release</button>
  </div>
 </form>
</dialog>
<script type="module" src="./quarantine.js"></script>
</body>
</html>
