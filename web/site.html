<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Site</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <a href="/">Sites</a>
  <span id="who" class="meta"></span>
  <span class="spacer"></span>
  <a id="people-link" class="button plain" href="/people.html" hidden>People</a>
  <button type="button" id="sign-out" class="plain">Sign out</button>
 </nav>
 <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1 id="title">Site</h1>
 <p id="role" class="kind"></p>
 <p id="archived-banner" class="note" hidden>This site is archived. It can be read but not changed.</p>
 <p id="error" role="alert" class="msg"></p>
 <section id="about" class="site-facts" aria-label="About this site" hidden>
  <p><span id="kind-label" class="mark"></span> <span id="hub-mark" class="mark own" hidden>Hub</span></p>
  <p id="description" class="description" hidden></p>
  <dl class="facts">
   <dt>Owners</dt><dd id="owners"></dd>
   <dt>Hub</dt><dd id="hub-line"></dd>
  </dl>
  <form id="join-hub" class="row" hidden>
   <div class="field">
    <label for="hub-choice">Join a hub</label>
    <select id="hub-choice"></select>
   </div>
   <button type="submit">Join hub</button>
  </form>
  <p id="leave-hub-row" hidden><button type="button" id="leave-hub" class="plain">Leave hub</button></p>
 </section>
 <section id="storage" aria-label="Storage" hidden>
  <p id="storage-text" class="meta"></p>
  <progress id="storage-bar" max="100" value="0" hidden></progress>
  <form id="quota-form" class="row" hidden>
   <div class="field">
    <label for="quota-gb">Storage quota in gigabytes</label>
    <input type="text" id="quota-gb" inputmode="decimal" autocomplete="off">
   </div>
   <button type="submit">Set quota</button>
   <button type="button" id="quota-remove" class="plain" hidden>Remove quota</button>
  </form>
 </section>
 <p><a id="bin-link" class="button plain" href="#">Recycle bin</a></p>
 <div id="site-tools" class="toolbar" hidden>
  <form id="new-library" class="row" hidden>
   <div class="field">
    <label for="library-name">New library</label>
    <input type="text" id="library-name" maxlength="120" autocomplete="off" required>
   </div>
   <div class="field">
    <label for="library-kind">Kind</label>
    <select id="library-kind"></select>
   </div>
   <button type="submit">New library</button>
  </form>
  <a id="settings-link" class="button plain" href="#">Site settings</a>
  <a id="access-link" class="button plain" href="#">Site access</a>
  <a id="explorer-link" class="button plain" href="#">Inheritance explorer</a>
  <a id="groups-link" class="button plain" href="#">Groups</a>
 </div>
 <h2>Libraries</h2>
 <ul id="libraries" class="list"></ul>
 <p id="empty" hidden>There are no libraries you can open here.</p>
 <section id="members" aria-labelledby="members-heading" hidden>
  <h2 id="members-heading">Sites in this hub</h2>
  <ul id="member-sites" class="list" aria-labelledby="members-heading"></ul>
  <p id="members-empty" class="meta" hidden>No site you can see has joined this hub yet.</p>
 </section>
</div>
<script type="module" src="./site.js"></script>
</body>
</html>
