<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Site</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <a href="/">Sites</a>
  <span id="who" class="meta"></span>
  <span class="spacer"></span>
  <a id="people-link" class="button plain" href="/people.html" hidden>People</a>
  <button type="button" id="sign-out" class="plain">Sign out</button>
 </nav>
 <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1 id="title">Site</h1>
 <p id="role" class="kind"></p>
 <p id="error" role="alert" class="msg"></p>
 <div id="site-tools" class="toolbar" hidden>
  <form id="new-library" class="row" hidden>
   <div class="field">
    <label for="library-name">New library</label>
    <input type="text" id="library-name" maxlength="120" autocomplete="off" required>
   </div>
   <button type="submit">New library</button>
  </form>
  <a id="access-link" class="button plain" href="#">Site access</a>
  <a id="explorer-link" class="button plain" href="#">Inheritance explorer</a>
  <a id="groups-link" class="button plain" href="#">Groups</a>
 </div>
 <h2>Libraries</h2>
 <ul id="libraries" class="list"></ul>
 <p id="empty" hidden>There are no libraries you can open here.</p>
</div>
<script type="module" src="./site.js"></script>
</body>
</html>
