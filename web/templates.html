<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Templates</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page admin-page">
 <nav class="topbar" aria-label="Account">
  <a class="wordmark" href="/" aria-label="ShareCraft, all sites"><span class="wordmark-word">ShareCraft</span></a>
  <span class="spacer"></span>
 </nav>
 <div class="admin-layout">
  <nav id="admin-nav" class="admin-nav" aria-label="Admin centre"></nav>
  <main class="admin-main">
 <h1>Templates</h1>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <p id="error" role="alert" class="msg"></p>
 <div id="content" hidden>
  <p class="meta">New sites are made from these. A template holds libraries, folders, settings and navigation, never files. Save one from a site's settings page, or import a package downloaded from another installation.</p>
  <ul id="templates" class="list" aria-label="Templates"></ul>
  <h2>Import a package</h2>
  <form id="import" class="stack">
   <div class="field">
    <label for="package">Template package (a .json file of at most 1 MB)</label>
    <input type="file" id="package" accept=".json,application/json" required>
   </div>
   <div><button type="submit">Import</button></div>
   <p id="import-msg" role="alert" class="msg"></p>
   <ul id="import-cleaned" class="list" aria-label="Names changed on import" hidden></ul>
  </form>
 </div>
  </main>
 </div>
</div>
<script type="module" src="./templates.js"></script>
</body>
</html>
