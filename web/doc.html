<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Document</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="frame" id="frame" data-state="connecting">
 <header class="bar">
  <a class="back" id="back" href="/" aria-label="Back to sites"><span class="mono" aria-hidden="true">S</span><span id="back-text">Sites</span></a>
  <div class="doc"><h1 id="title">Document</h1><span id="docline"></span></div>
  <span class="spacer"></span>
  <a id="access-link" class="button plain" href="#" hidden>Access</a>
  <span class="status" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="status">Loading…</span></span>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
 </header>
 <p id="problem" role="alert" class="problem"></p>
 <div class="body" id="editor" hidden>
  <main class="main">
   <p id="readonly-note" class="note" hidden>You can read this document but not change it.</p>
   <label for="text" class="label">Document text</label>
   <textarea id="text" spellcheck="true" readonly></textarea>
  </main>
  <aside aria-labelledby="people-heading">
   <h2 id="people-heading">People here</h2>
   <ul id="people"></ul>
  </aside>
 </div>
</div>
<script type="module" src="./doc.js"></script>
</body>
</html>
