<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Document</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body class="full">
<div class="frame full editor-frame" id="frame" data-state="connecting">
 <header class="bar ebar">
  <a class="back" id="back" href="/" aria-label="Back to sites" title="Back to sites"><span class="chev" aria-hidden="true">‹</span><span class="mono" aria-hidden="true">S</span></a>
  <div class="doc"><h1 id="title">Document</h1><nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav></div>
  <span class="spacer"></span>
  <span class="status" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="status">Loading…</span></span>
  <span id="presence" class="presence" role="img" hidden></span>
  <span class="bar-actions">
   <a id="access-link" class="button plain wide-only" href="#" hidden>Share</a>
   <a id="download" class="button plain wide-only" download hidden>Download</a>
   <button type="button" id="focus-toggle" class="plain wide-only" aria-pressed="false" aria-keyshortcuts="Control+Shift+F" title="Focus mode (Ctrl+Shift+F)">Focus</button>
   <span class="menu-wrap"><button type="button" id="more" class="plain dots" aria-label="More">⋯</button><ul id="more-menu" class="menu end" aria-label="More"></ul></span>
  </span>
 </header>
 <button type="button" id="focus-exit" class="focus-exit" aria-keyshortcuts="Control+Shift+F" title="Exit focus (Ctrl+Shift+F)" hidden><i aria-hidden="true"></i>Exit focus</button>
 <span id="focus-status" class="visually-hidden" role="status" aria-live="polite"></span>
 <div id="banner" class="banner strip idle" role="status" aria-live="polite"><span id="banner-text"></span></div>
 <p id="problem" role="alert" class="problem"></p>
 <main class="doc-main editor-area" id="editor" hidden>
  <p id="readonly-note" class="note" hidden>You can read this document but not change it.</p>
  <label for="text" class="visually-hidden">Document text</label>
  <textarea id="text" spellcheck="true" readonly></textarea>
 </main>
</div>
<script type="module" src="./doc.js"></script>
</body>
</html>
