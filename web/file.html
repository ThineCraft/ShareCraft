<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Document</title>
<link rel="stylesheet" href="./style.css">
</head>
<body class="full">
<div class="frame full" id="frame" data-state="connecting">
 <header class="bar">
  <a class="back" id="back" href="/" aria-label="Back to sites"><span class="mono" aria-hidden="true">S</span><span id="back-text">Sites</span></a>
  <div class="doc"><h1 id="title">Document</h1><span id="docline"></span></div>
  <span class="spacer"></span>
  <span class="status" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="status">Loading…</span></span>
  <button type="button" id="save" hidden>Save</button>
  <a id="download" class="button plain" download hidden>Download</a>
  <a id="access-link" class="button plain" href="#" hidden>Access</a>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
 </header>
 <div id="banner" class="banner idle" role="status" aria-live="polite"><span id="banner-text"></span><span id="banner-actions" class="actions"></span></div>
 <p id="problem" role="alert" class="problem"></p>
 <main id="editor-area" class="editor-area"></main>
</div>
<script type="module" src="./file.js"></script>
</body>
</html>
