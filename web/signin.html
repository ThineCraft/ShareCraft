<!doctype html>
<html lang="en">
<head>
<meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Sign in</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<main class="page">
 <h1>Sign in to ShareCraft</h1>
 <!-- POST and a button that starts disabled: until signin.js has loaded, the browser can
      never submit the form the default way, which would put the email and password in the
      page address (and so in history and proxy logs). -->
 <form id="form" class="stack" method="post" action="/api/session">
  <div class="field">
   <label for="email">Email</label>
   <input type="email" id="email" name="email" autocomplete="username" required>
  </div>
  <div class="field">
   <label for="password">Password</label>
   <input type="password" id="password" name="password" autocomplete="current-password" required>
  </div>
  <p id="error" role="alert" class="msg"></p>
  <div><button type="submit" id="submit" disabled>Sign in</button></div>
 </form>
</main>
<script type="module" src="./signin.js"></script>
</body>
</html>
