<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Sign in</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="page">
 <h1>Sign in to ShareCraft</h1>
 <form id="form" class="stack">
  <div class="field">
   <label for="email">Email</label>
   <input type="email" id="email" name="email" autocomplete="username" required>
  </div>
  <div class="field">
   <label for="password">Password</label>
   <input type="password" id="password" name="password" autocomplete="current-password" required>
  </div>
  <p id="error" role="alert" class="msg" hidden></p>
  <div><button type="submit" id="submit">Sign in</button></div>
 </form>
</main>
<script type="module" src="./signin.js"></script>
</body>
</html>
