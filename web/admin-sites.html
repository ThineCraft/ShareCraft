<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Sites</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<div class="page admin-page">
 <nav class="topbar" aria-label="Account">
  <a class="wordmark" href="/" aria-label="ShareCraft, all sites"><span class="wordmark-word">ShareCraft</span></a>
  <span class="spacer"></span>
 </nav>
 <div class="admin-layout">
  <nav id="admin-nav" class="admin-nav" aria-label="Admin centre"></nav>
  <main class="admin-main">
 <h1>Sites</h1>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <p id="error" role="alert" class="msg"></p>
 <div id="content" hidden>
  <p class="meta">Every site, live, archived or deleted. An archived site is read-only and hidden from the directory until it is reactivated. A deleted site can be restored for 93 days, then it is erased.</p>
  <p id="no-owner" class="note" hidden></p>
  <ul id="sites" class="list" aria-label="Sites"></ul>
  </div>
  </main>
 </div>
</div>
<script type="module" src="./admin-sites.js"></script>
</body>
</html>
