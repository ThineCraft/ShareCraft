<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Manage sites</title>

</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <a href="/">Sites</a>
  <a href="/templates.html">Templates</a>
  <a href="/people.html">People</a>
  <span class="spacer"></span>
  <span id="who" class="meta"></span>
 </nav>
 <h1>Manage sites</h1>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <p id="error" role="alert" class="msg"></p>
 <div id="content" hidden>
  <p class="meta">Every site, live, archived or deleted. An archived site is read-only and hidden from the directory until it is reactivated. A deleted site can be restored for 93 days, then it is erased.</p>
  <p id="no-owner" class="note" hidden></p>
  <ul id="sites" class="list" aria-label="Sites"></ul>
  <p id="empty" class="meta" hidden>There are no sites yet.</p>
 </div>
</div>
<script type="module" src="./admin-sites.js"></script>
