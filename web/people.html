<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — People</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <a href="/">Documents</a>
  <span class="spacer"></span>
  <span id="who" class="meta"></span>
 </nav>
 <h1>People</h1>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <p id="error" role="alert" class="msg" hidden></p>
 <div id="content" hidden>
  <ul id="users" class="list"></ul>
  <h2>Add a person</h2>
  <form id="add" class="stack">
   <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="off" required>
   </div>
   <div class="field">
    <label for="name">Name</label>
    <input type="text" id="name" maxlength="60" autocomplete="off" required>
   </div>
   <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="new-password" required>
   </div>
   <label class="check"><input type="checkbox" id="admin"> Administrator</label>
   <div><button type="submit">Add person</button></div>
  </form>
 </div>
</div>
<script type="module" src="./people.js"></script>
</body>
</html>
