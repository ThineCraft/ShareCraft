<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — People</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page admin-page">
 <nav class="topbar" aria-label="Account">
  <a class="wordmark" href="/" aria-label="ShareCraft, all sites"><span class="wordmark-word">ShareCraft</span></a>
  <span class="spacer"></span>
 </nav>
 <div class="admin-layout">
  <nav id="admin-nav" class="admin-nav" aria-label="Admin centre"></nav>
  <main class="admin-main">
   <div class="admin-head">
    <h1>People</h1>
    <button type="button" id="add-button" hidden>Add a person</button>
   </div>
   <p id="summary" class="admin-summary"></p>
   <p id="status" role="status" aria-live="polite" class="meta"></p>
   <p id="error" role="alert" class="msg"></p>
   <div id="content" hidden>
    <ul id="users" class="list people-list" aria-label="People"></ul>
   </div>
  </main>
 </div>
</div>

<dialog id="add-dialog" aria-labelledby="add-title">
 <form id="add" class="stack" novalidate>
  <h2 id="add-title">Add a person</h2>
  <div class="field">
   <label for="email">Email</label>
   <input type="email" id="email" autocomplete="off" spellcheck="false" required>
  </div>
  <div class="field">
   <label for="name">Name</label>
   <input type="text" id="name" maxlength="60" autocomplete="off" required>
  </div>
  <div class="field">
   <label for="password">Password</label>
   <div class="password-row">
    <input type="password" id="password" autocomplete="new-password" required aria-describedby="password-hint">
    <button type="button" id="password-toggle" class="plain" aria-pressed="false" aria-controls="password">Show</button>
   </div>
   <small id="password-hint" class="meta password-hint">At least 10 characters.</small>
  </div>
  <label class="check"><input type="checkbox" id="admin"> Administrator: can manage people, sites and settings</label>
  <p id="add-error" role="alert" class="msg"></p>
  <div class="row end">
   <button type="button" id="add-cancel" class="plain">Cancel</button>
   <button type="submit" id="add-submit">Add person</button>
  </div>
 </form>
</dialog>
<script type="module" src="./skeleton.js"></script>
<script type="module" src="./people.js"></script>
</body>
</html>
