<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ShareCraft development build: edit one plain-text document together.">
<title>ShareCraft — Plain text (development build)</title>
<style>
:root{color-scheme:light dark;
--bg:light-dark(#f5f7f8,#141c20);--paper:light-dark(#fff,#202a2e);--sheet:light-dark(#fff,#172023);--text:light-dark(#233239,#e7edf0);--muted:light-dark(#5d6d75,#afbdc4);--line:light-dark(#dfe6e9,#39474e);
--accent:#3156c9;--accent-ink:light-dark(#3156c9,#9db4ff);--soft:color-mix(in srgb,var(--accent) 11%,var(--paper));
--ok:light-dark(#1d6b47,#7fd3a6);--warn-bg:light-dark(#fdf1dc,#43351c);--warn-ink:light-dark(#7a4a05,#f1c98a);--stop-bg:light-dark(#fde8e6,#472523);--stop-ink:light-dark(#9a2a20,#f3a9a1);
font:14px/1.5 ui-sans-serif,system-ui,'Segoe UI',sans-serif;color:var(--text);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;padding:20px 16px 40px;background:var(--bg)}
input,textarea,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
.frame{max-width:1040px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:clip}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;min-height:52px;padding:8px 12px;border-bottom:1px solid var(--line);box-shadow:inset 0 3px var(--accent)}
.mono{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;font-weight:600;font-size:12px;flex:none}
.doc{min-width:0;display:flex;flex-direction:column;line-height:1.25}
.doc h1{font-size:14px;font-weight:600;margin:0}
.doc span{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.spacer{flex:1}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--ok);max-width:100%}
.status i{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.frame[data-state=saving] .status,.frame[data-state=connecting] .status{color:var(--muted)}
.frame[data-state=saving] .status i,.frame[data-state=connecting] .status i{animation:pulse 1s infinite}
.frame:is([data-state=offline],[data-state=notice]) .status{color:var(--warn-ink);background:var(--warn-bg);border-color:transparent}
.frame[data-state=failed] .status{color:var(--stop-ink);background:var(--stop-bg);border-color:transparent}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.status i{animation:none!important}}
.dev{margin:0;padding:10px 16px;font-size:13px;background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid var(--line)}
.dev b{font-weight:600}
.body{display:grid;grid-template-columns:minmax(0,1fr) 240px}
.main{padding:16px;min-width:0;background:var(--bg)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;max-width:320px}
label,.label{font-size:12px;color:var(--muted)}
input[type=text]{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 10px;min-height:36px}
textarea{display:block;width:100%;min-height:420px;resize:vertical;border:1px solid var(--line);border-radius:3px;background:var(--sheet);padding:20px 22px;font:15px/1.7 ui-monospace,'Cascadia Mono',Consolas,monospace;tab-size:4}
textarea:read-only{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere}
code{font:12px ui-monospace,'Cascadia Mono',Consolas,monospace}
aside{border-left:1px solid var(--line);padding:14px 16px}
aside h2{font-size:13px;margin:0 0 8px}
#people{list-style:none;margin:0;padding:0}
#people li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
#people li:last-child{border-bottom:0}
.av{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;font-size:10px;font-weight:600;border:2px solid var(--muted);color:var(--muted);flex:none}
#people li.me .av{border-color:var(--accent-ink);color:var(--accent-ink)}
#people small{color:var(--muted);font-size:11px}
.empty{color:var(--muted);font-size:12px}
@media (max-width:760px){
 body{padding:0 0 24px}
 .frame{border-radius:0;border-left:0;border-right:0}
 .body{grid-template-columns:1fr}
 aside{border-left:0;border-top:1px solid var(--line)}
 .status{order:5;flex-basis:100%;justify-content:center;border-radius:6px}
 .main{padding:12px 16px}
 textarea{min-height:300px;padding:14px}
 .field{max-width:none}
 input[type=text]{min-height:44px}
}
</style>
</head>
<body>
<div class="frame" id="frame" data-state="connecting">
 <header class="bar">
  <i class="mono" aria-hidden="true">S</i>
  <div class="doc"><h1>Plain-text document</h1><span id="docline">ShareCraft development build</span></div>
  <span class="spacer"></span>
  <span class="status" role="status" aria-live="polite" aria-label="Document status"><i aria-hidden="true"></i><span id="status">Loading…</span></span>
 </header>
 <p class="dev"><b>Development build. There is no sign-in.</b> Anyone who can open this address on this computer can read and change the document.</p>
 <div class="body">
  <main class="main">
   <div class="field">
    <label for="name">Your name, as others see it</label>
    <input type="text" id="name" maxlength="60" autocomplete="nickname" placeholder="Guest">
   </div>
   <label for="text" class="label">Document text</label>
   <textarea id="text" spellcheck="true" readonly aria-describedby="share"></textarea>
   <p class="hint" id="share">To edit together, open this page's address, including the part after <code>#</code>, in another tab or window.</p>
  </main>
  <aside aria-labelledby="people-heading">
   <h2 id="people-heading">People here</h2>
   <ul id="people" aria-labelledby="people-heading"></ul>
  </aside>
 </div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
