<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Documents</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <strong>ShareCraft</strong>
  <span id="who" class="meta"></span>
  <span class="spacer"></span>
  <a id="people-link" class="button plain" href="/people.html" hidden>People</a>
  <button type="button" id="sign-out" class="plain">Sign out</button>
 </nav>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1>Documents</h1>
 <form id="new-doc" class="row">
  <div class="field">
   <label for="doc-name">New document name (optional)</label>
   <input type="text" id="doc-name" maxlength="120" autocomplete="off">
  </div>
  <button type="submit">New document</button>
 </form>
 <p id="error" role="alert" class="msg"></p>
 <h2>Your documents</h2>
 <ul id="docs" class="list"></ul>
 <p id="empty" hidden>No documents yet.</p>
</div>
<script type="module" src="./home.js"></script>
</body>
</html>
