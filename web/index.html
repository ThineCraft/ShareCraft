<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Sites</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <strong>ShareCraft</strong>
  <span id="who" class="meta"></span>
  <span class="spacer"></span>
  <a id="requests-link" class="button plain" href="/requests.html" hidden>Requests <span id="requests-count" class="badge"></span></a>
  <a id="people-link" class="button plain" href="/people.html" hidden>People</a>
  <button type="button" id="sign-out" class="plain">Sign out</button>
 </nav>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1>Sites</h1>
 <form id="new-site" class="row" hidden>
  <div class="field">
   <label for="site-name">New site</label>
   <input type="text" id="site-name" maxlength="120" autocomplete="off" required>
  </div>
  <button type="submit">New site</button>
 </form>
 <p id="error" role="alert" class="msg"></p>
 <ul id="sites" class="list"></ul>
 <p id="empty" hidden>You do not have access to any site yet.</p>
 <section id="mine" aria-labelledby="mine-heading" hidden>
  <h2 id="mine-heading">My requests</h2>
  <p class="meta">Requests for access that someone has decided.</p>
  <ul id="mine-list" class="list" aria-labelledby="mine-heading"></ul>
 </section>
</div>
<script type="module" src="./home.js"></script>
</body>
</html>
