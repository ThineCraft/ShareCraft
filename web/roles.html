<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Roles</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="page">
 <nav class="topbar" aria-label="Account">
  <a href="/">Sites</a>
  <span id="who" class="meta"></span>
  <span class="spacer"></span>
  <a id="people-link" class="button plain" href="/people.html" hidden>People</a>
  <button type="button" id="sign-out" class="plain">Sign out</button>
 </nav>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1>Roles</h1>
 <p id="error" role="alert" class="msg"></p>
 <div id="content" hidden>
  <p class="meta">A role is a named set of permissions. Viewer, Editor and Owner are built in. Changing a role changes the access of everyone who has it, everywhere, at once.</p>
  <h2 id="roles-heading">All roles</h2>
  <ul id="roles" class="list" aria-labelledby="roles-heading"></ul>
  <h2>New role</h2>
  <form id="new-role" class="stack">
   <div class="field">
    <label for="role-name">Name</label>
    <input type="text" id="role-name" maxlength="60" autocomplete="off" required>
   </div>
   <fieldset id="new-perms" class="perms"><legend>Permissions</legend></fieldset>
   <div><button type="submit">Create role</button></div>
  </form>
 </div>
</div>
<script type="module" src="./roles.js"></script>
</body>
</html>
