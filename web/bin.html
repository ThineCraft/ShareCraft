<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Recycle bin</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<div class="page workspace reading">
 <nav class="topbar" aria-label="Account">
  <a class="wordmark" href="/" aria-label="ShareCraft, all sites"><span class="wordmark-word">ShareCraft</span></a>
  <span class="spacer"></span>
 </nav>
 <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1 id="title">Recycle bin</h1>
 <p id="error" role="alert" class="msg"></p>
 <div id="bin-head" class="bin-head">
 <p id="summary" class="meta bin-summary"></p>
 <nav id="stages" class="sitenav" aria-label="Recycle bin stage" hidden>
  <ul>
   <li><a id="stage-first" href="#first">Deleted items</a></li>
   <li><a id="stage-second" href="#second">Second stage (site managers)</a></li>
  </ul>
 </nav>
 <p id="stage-help" class="meta"></p>
 <div id="bin-filters" class="filters bin-filters" role="search" aria-label="Find in the recycle bin" hidden>
  <div class="field bin-search"><label for="bin-search">Search by name or place</label><input type="search" id="bin-search" autocomplete="off" spellcheck="false"></div>
  <div class="field"><label for="bin-by">Deleted by</label><select id="bin-by"><option value="anyone">Anyone</option><option value="me">Me</option></select></div>
  <div class="field"><label for="bin-kind">Type</label><select id="bin-kind"><option value="">Any type</option></select></div>
 </div>
 <p id="shown" class="meta" role="status" aria-live="polite"></p>
 </div>
 <div id="bin-bar" class="toolbar bin-bar" role="toolbar" aria-label="Selected items" hidden>
  <label class="check"><input type="checkbox" id="select-all"> Select all</label>
  <span id="selected-count" class="meta" role="status" aria-live="polite"></span>
  <span class="spacer"></span>
  <button type="button" id="bulk-restore" disabled>Restore selected</button>
  <button type="button" id="bulk-delete" class="plain" disabled>Delete selected</button>
  <button type="button" id="empty-bin" class="plain" hidden>Empty</button>
 </div>
 <p id="bin-status" role="status" aria-live="polite" class="meta"></p>
 <ul id="bin-failures" class="list" aria-label="Items that could not be removed" hidden></ul>
 <div id="groups" class="bin-groups"></div>
 <div id="empty" class="bin-empty" hidden><p id="empty-text"></p><button type="button" id="clear-filters" class="plain" hidden>Clear search and filters</button></div>
 <p><button type="button" id="more" class="plain" hidden>Show more</button></p>
 <p id="keys-status" class="visually-hidden" role="status" aria-live="polite"></p>
</div>
<script type="module" src="./skeleton.js"></script>
<script type="module" src="./bin.js"></script>
</body>
</html>
