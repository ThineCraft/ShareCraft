<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareCraft — Access requests</title>
<script src="./appearance.js"></script>
<link rel="stylesheet" href="./style.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<div class="page admin-page">
 <nav class="topbar" aria-label="Account">
  <a class="wordmark" href="/" aria-label="ShareCraft, all sites"><span class="wordmark-word">ShareCraft</span></a>
  <span class="spacer"></span>
 </nav>
 <div class="admin-layout">
  <nav id="admin-nav" class="admin-nav" aria-label="Admin centre"></nav>
  <main class="admin-main">
 <p id="status" role="status" aria-live="polite" class="meta"></p>
 <h1>Access requests</h1>
 <p class="meta">People asking for access to items you manage access on. Approving gives them the role you choose on that item.</p>
 <p id="error" role="alert" class="msg"></p>
 <ul id="requests" class="list" aria-label="Open requests"></ul>
 <p id="empty" class="meta" hidden>There are no open requests.</p>
  </main>
 </div>
</div>
<script type="module" src="./requests.js"></script>
</body>
</html>
