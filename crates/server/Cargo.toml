[package]
name = "server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sharecraft-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
collab-core = { path = "../collab-core" }
collab-text = { path = "../collab-text" }
dotenvy = "0.15.7"
flate2 = "1.1.11"
futures-util = "0.3.34"
getrandom = "0.4.3"
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
# Webhook signatures (HMAC-SHA256, checked in constant time).
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
protocol = { path = "../protocol" }
records = { path = "../records" }
# HTTPS to GitHub through the operating system: Schannel on Windows, Security.framework on
# macOS, and the system OpenSSL library on Linux.
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream"] }
revisions = { path = "../revisions" }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
flate2 = "1.1.11"
collab-live = { path = "../collab-live", features = ["stand-in"] }
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
records = { path = "../records", features = ["test-support"] }
revisions = { path = "../revisions", features = ["test-support"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "stream"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
uuid = { version = "1.29.2", features = ["v4"] }
web-client = { path = "../web-client" }
