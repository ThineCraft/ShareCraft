[package]
name = "revisions"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
collab-core = { path = "../collab-core" }
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
serde = { version = "1.0.229", features = ["derive"] }
