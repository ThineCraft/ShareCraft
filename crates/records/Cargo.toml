[package]
name = "records"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Per-test database schemas; for tests only.
test-support = []

[dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2.0.21"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
records = { path = ".", features = ["test-support"] }
