[package]
name = "records"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Per-test database schemas; for tests only.
test-support = []

[dependencies]
argon2 = "0.6.0"
collab-core = { version = "0.1.0", path = "../collab-core" }
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "json", "migrate", "macros"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "time", "rt-multi-thread"] }
records = { path = ".", features = ["test-support"] }
