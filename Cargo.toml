[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ThineCraft/ShareCraft"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# The editors' compressed copies are made by xtask, which runs unoptimised; the compressors
# must not be (Brotli on a 150 MB file is minutes slower otherwise).
[profile.dev.package.brotli]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

# Git hashes every object it writes and reads with SHA-1 (collision-detecting), and compresses
# each one; unoptimised, these dominate a tree of 100,000 records in a debug build.
[profile.dev.package.sha1dc]
opt-level = 3

[profile.dev.package.gix-hash]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

# Every file saved or uploaded is hashed with SHA-256 as it streams into the content store.
[profile.dev.package.sha2]
opt-level = 3
